<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- 🔥 Self-host font -->
		<style>
			@font-face {
				font-family: 'VT323';
				src: url('%sveltekit.assets%/fonts/VT323/VT323-Regular.ttf') format('truetype');
				font-weight: normal;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'JetBrains Mono';
				src: url('%sveltekit.assets%/fonts/JetBrainsMono/JetBrainsMonoNLNerdFont-Regular.ttf')
					format('truetype');
				font-weight: normal;
				font-style: normal;
				font-display: swap;
			}

			html,
			body {
				margin: 0;
				padding: 0;
				background-color: #000;
				width: 100%;
				height: 100%;
				font-family: 'VT323', 'JetBrains Mono', monospace;
				color: #eee;
			}
		</style>

		%sveltekit.head%
	</head>

	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
